ServerName localhost
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <DirectoryMatch "^/var/www/html/(config|src|sessions|templates)(/|$)">
        Require all denied
    </DirectoryMatch>
    <LocationMatch "^/tools/.*\.php(?:/|$)">
        Require all denied
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
