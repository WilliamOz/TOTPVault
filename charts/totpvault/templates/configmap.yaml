apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "totpvault.fullname" . }}
  labels:
    {{- include "totpvault.labels" . | nindent 4 }}
data:
  DB_HOST: {{ include "totpvault.databaseHost" . | quote }}
  DB_PORT: {{ include "totpvault.databasePort" . | quote }}
  DB_NAME: {{ include "totpvault.databaseName" . | quote }}
  DB_USER: {{ include "totpvault.databaseUser" . | quote }}
  TRUST_TLS_PROXY: {{ .Values.appSecurity.trustTlsProxy | quote }}
  AD_HOST: {{ .Values.ad.host | quote }}
  AD_PORT: {{ .Values.ad.port | quote }}
  AD_BASE_DN: {{ .Values.ad.baseDn | quote }}
  AD_BIND_DN: {{ .Values.ad.bindDn | quote }}
  AD_ACCESS_GROUP_DN: {{ .Values.ad.accessGroupDn | quote }}
  AD_ADMIN_GROUP_DN: {{ .Values.ad.adminGroupDn | quote }}
  {{- if .Values.ad.caSecret }}
  AD_CA_FILE: "/run/totpvault/ad-ca.pem"
  {{- end }}
