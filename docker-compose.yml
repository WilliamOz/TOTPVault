services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-totpvault}
      DB_USER: ${DB_USER:-totpvault}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      LEGACY_ENCRYPTION_KEY: ${LEGACY_ENCRYPTION_KEY:-}
      AD_HOST: ${AD_HOST:?AD_HOST is required}
      AD_PORT: ${AD_PORT:-636}
      AD_BASE_DN: ${AD_BASE_DN:?AD_BASE_DN is required}
      AD_BIND_DN: ${AD_BIND_DN:?AD_BIND_DN is required}
      AD_BIND_PASSWORD: ${AD_BIND_PASSWORD:?AD_BIND_PASSWORD is required}
      AD_CA_FILE: ${AD_CA_FILE:-/run/totpvault/ad-ca.pem}
      AD_ACCESS_GROUP_DN: ${AD_ACCESS_GROUP_DN:-}
      AD_ADMIN_GROUP_DN: ${AD_ADMIN_GROUP_DN:?AD_ADMIN_GROUP_DN is required}
      TRUST_TLS_PROXY: ${TRUST_TLS_PROXY:-true}
      ALLOW_HTTP_DEV: ${ALLOW_HTTP_DEV:-false}
    volumes:
      - ./local-config:/run/totpvault:ro
      - totpvault-sessions:/var/www/html/sessions
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${DB_NAME:-totpvault}
      MARIADB_USER: ${DB_USER:-totpvault}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - totpvault-db-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  totpvault-db-data:
  totpvault-sessions:
